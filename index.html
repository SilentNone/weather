<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background: #f0f2f5;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      h1 {
        text-align: center;
        margin-bottom: 20px;
      }
      .search-section {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      #searchBtn {
        background-color: #007bff;
        color: white;
      }
      .theme-toggle {
        text-align: right;
        margin-bottom: 20px;
      }
      #themeBtn {
        width: auto;
      }
      #cityInput {
        flex: 1;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      button {
        padding: 12px 18px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      .weather-card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 30px;
      }
      .weather-card p {
        margin-bottom: 8px;
      }
      .weather-card h2 {
        margin-bottom: 20px;
      }
      #forecast {
        background: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 30px;
        width: 100%;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 15px;
      }
      #forecast h2 {
        margin-bottom: 20px;
        grid-column: 1 / -1;
      }
      .forecast-card {
        background: #f0f2f5;
        padding: 15px;
        border-radius: 10px;
        text-align: center;
        min-height: 160px;
      }
      .forecast-card h3 {
        margin-bottom: 15px;
        font-size: 16px;
      }
      .forecast-card p {
        margin-bottom: 8px;
        font-size: 14px;
      }
      #favoriteBtn {
        margin-top: 20px;
        background-color: #007bff;
        color: white;
        width: auto;
      }
      .error {
        color: red;
        margin-bottom: 20px;
      }

      .favorites-section {
        background: white;
        padding: 20px;
        border-radius: 10px;
      }
      #favoritesList > div {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 15px;
        margin-top: 10px;
        background: #f0f2f5;
        border-radius: 8px;
      }
      #favoritesList button {
        width: auto;
        padding: 8px 12px;
        background: #dc3545;
        color: white;
      }
      .favorites-section h3 {
        margin-bottom: 15px;
      }
      .dark {
        background: #222;
        color: white;
      }
      .dark .weather-card,
      .dark .favorites-section {
        background: #333;
        color: white;
      }
      .dark #cityInput {
        background: #444;
        color: white;
        border-color: #666;
      }
      .dark #forecast {
        background: #333;
        color: white;
      }

      .dark .forecast-card {
        background: #444;
        color: white;
      }
      .dark #favoritesList > div {
        background: #444;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #ddd;
        border-top: 4px solid #007bff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (max-width: 600px) {
        .container {
          padding: 15px;
        }
        .search-section {
          flex-direction: column;
        }
        #cityInput,
        #searchBtn {
          width: 100%;
        }
        .weather-card,
        .favorites-section {
          padding: 15px;
        }
        h1 {
          font-size: 28px;
        }
        #forecast {
          grid-template-columns: 1fr;
        }
        #themeBtn {
          width: auto;
        }
        #favoriteBtn {
          width: auto;
        }
        #favoritesList button {
          width: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Weather Dashboard</h1>
      <div class="theme-toggle">
        <button id="themeBtn">Dark</button>
      </div>
      <div class="search-section">
        <input type="text" id="cityInput" placeholder="Enter city name..." />
        <button id="searchBtn">Search Weather</button>
      </div>
      <div id="weatherCard" class="weather-card" style="display: none"></div>
      <div id="forecast"></div>
      <div id="errorMsg" class="error" style="display: none"></div>
      <div class="favorites-section">
        <h3>Favorites</h3>
        <div id="favoritesList"></div>
      </div>
    </div>
    <script>
      const API_KEY = "17b04179279ce94bfeced6667ee1163e";
      async function getWeather(city) {
        try {
          const response = await fetch(
            `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`,
          );
          if (!response.ok) {
            throw new Error("No city is found");
          }
          const data = await response.json();
          return {
            cityname: data.name,
            temp: Math.round(data.main.temp),
            feelsLike: Math.round(data.main.feels_like),
            description: data.weather[0].description,
            humidity: data.main.humidity,
            windSpeed: data.wind.speed,
          };
        } catch (error) {
          console.log("Error:", error.message);
          throw error;
        }
      }
      async function getForecast(city) {
        try {
          const response = await fetch(
            `https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${API_KEY}&units=metric`,
          );
          if (!response.ok) {
            throw new Error("Forecast not found");
          }
          const data = await response.json();
          const forecast = [];
          for (let i = 0; i < data.list.length; i += 8) {
            forecast.push(data.list[i]);
            if (forecast.length === 5) {
              break;
            }
          }
          return forecast;
        } catch (error) {
          console.log("Error:", error.message);
          throw error;
        }
      }
      function displayForecast(forecast) {
        const forecastDiv = document.getElementById("forecast");
        forecastDiv.innerHTML = "<h2>5-Day Forecast</h2>";
        forecast.forEach((day) => {
          const card = document.createElement("div");
          card.className = "forecast-card";
          card.innerHTML = `
                  <h3>${day.dt_txt.split(" ")[0]}</h3>
                  <p>Temperature: ${Math.round(day.main.temp)}°C</p>
                  <p>${day.weather[0].description}</p>
                  <p>Humidity: ${day.main.humidity}%</p>
                  <p>Windspeed:${day.wind.speed}m/s</p>
                `;
          forecastDiv.appendChild(card);
        });
      }
      async function addFavorite(city) {
        const favorites = JSON.parse(localStorage.getItem("favorites")) || [];
        if (favorites.includes(city)) {
          return;
        }
        favorites.push(city);
        localStorage.setItem("favorites", JSON.stringify(favorites));
        loadFavorites();
      }
      function loadFavorites() {
        const favorites = JSON.parse(localStorage.getItem("favorites")) || [];
        const favoritesList = document.getElementById("favoritesList");
        favoritesList.innerHTML = "";
        favorites.forEach((city) => {
          let div = document.createElement("div");
          div.textContent = city;
          const removeBtn = document.createElement("button");
          removeBtn.textContent = "Remove";
          removeBtn.addEventListener("click", () => {
            const updatedFavorites = favorites.filter((item) => item !== city);
            localStorage.setItem("favorites", JSON.stringify(updatedFavorites));
            loadFavorites();
          });
          favoritesList.appendChild(div);
          div.appendChild(removeBtn);
        });
      }
      async function searchWeather(city) {
        const weatherCard = document.getElementById("weatherCard");
        const errorMsg = document.getElementById("errorMsg");
        errorMsg.style.display = "none";
        weatherCard.style.display = "block";
        weatherCard.innerHTML = '<div class="spinner"></div>';
        try {
          const weather = await getWeather(city);
          const forecast = await getForecast(city);
          displayForecast(forecast);
          weatherCard.innerHTML = `
                        <h2>${weather.cityname}</h2>
                        <p>Temperature: ${weather.temp}°C</p>
                        <p>Feels Like: ${weather.feelsLike}°C</p>
                        <p>${weather.description}</p>
                        <p>Humidity: ${weather.humidity}%</p>
                        <p>Wind Speed: ${weather.windSpeed} m/s</p>
                        <button id="favoriteBtn">Add to Favorites</button>
                    `;
          document
            .getElementById("favoriteBtn")
            .addEventListener("click", function () {
              addFavorite(weather.cityname);
            });
        } catch (error) {
          weatherCard.style.display = "none";
          errorMsg.textContent = error.message;
          errorMsg.style.display = "block";
        }
      }
      let timer;
      function debounceSearch() {
        clearTimeout(timer);
        const city = cityInput.value.trim();
        if (city === "") {
          weatherCard.style.display = "none";
          forecast.innerHTML = "";
          errorMsg.style.display = "none";
          return;
        }
        timer = setTimeout(function () {
          searchWeather(city);
        }, 500);
      }
      document.addEventListener("DOMContentLoaded", function () {
        const cityInput = document.getElementById("cityInput");
        const searchBtn = document.getElementById("searchBtn");
        searchBtn.addEventListener("click", function () {
          const city = cityInput.value.trim();
          if (city === "") {
            alert("Please enter a city name");
            return;
          }
          searchWeather(city);
        });
        cityInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            const city = cityInput.value.trim();
            if (city === "") {
              alert("Please enter a city name.");
              return;
            }
            searchWeather(city);
          }
        });
        cityInput.addEventListener("input", debounceSearch);
        const themeBtn = document.getElementById("themeBtn");
        themeBtn.addEventListener("click", function () {
          document.body.classList.toggle("dark");
          if (document.body.classList.contains("dark")) {
            themeBtn.textContent = "Light";
          } else {
            themeBtn.textContent = "Dark";
          }
        });
        loadFavorites();
      });
    </script>
  </body>
</html>
